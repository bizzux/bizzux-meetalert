name: Build Android APK

# Runs on GitHub's free hosted runners - no EAS queue involved.
# Produces a release APK with the JS bundle baked in (fully standalone -
# no Metro/dev server connection needed to run it). It's signed with the
# default Android debug key (same as the standard React Native/Expo
# template ships), which is fine for installing on your own device; set up
# a real release signing config later, once you're ready to actually
# distribute the app beyond your own device.

on:
  workflow_dispatch: {}   # lets you trigger a build manually from the Actions tab
  push:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Java (required by Android Gradle build)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build release APK (standalone, JS bundle included)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MeetAlert-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
