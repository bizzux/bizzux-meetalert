name: Build Android APK

# Runs on GitHub's free hosted runners - no EAS queue involved.
# Produces a debug-signed APK (installable directly on your phone for
# sideloading/testing). Switch to a real release signing config later,
# once you're ready to actually distribute the app beyond your own device.

on:
  workflow_dispatch: {}   # lets you trigger a build manually from the Actions tab
  push:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Java (required by Android Gradle build)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MeetAlert-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
